services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: propertypulse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d propertypulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/PropertyPulse.Api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Development enables Swagger, automatic migrations, and seed data.
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=db;Port=5432;Database=propertypulse;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-development-only-signing-key-change-outside-dev}
      ImageStorage__RootPath: /app/data/property-images
    volumes:
      - property-images:/app/data/property-images
    ports:
      - "5000:8080"

volumes:
  postgres-data:
  property-images:
